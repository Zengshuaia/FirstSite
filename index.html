<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六万 · 一个关于选择的故事</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0f0d15;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8e3f0;
    padding: 16px;
  }
  #game {
    width: 100%;
    max-width: 520px;
    background: linear-gradient(160deg, #1a1626, #14111d);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }
  #game::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(244,114,182,0.18), transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .chapter {
    font-size: 12px;
    letter-spacing: 3px;
    color: #a78bfa;
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .scene {
    font-size: 17px;
    line-height: 1.85;
    color: #d8d2e8;
    margin-bottom: 26px;
    min-height: 130px;
    white-space: pre-wrap;
  }
  .scene .em { color: #f472b6; }
  .scene .warn { color: #fbbf24; }

  .choices { display: flex; flex-direction: column; gap: 10px; }

  button.choice {
    text-align: left;
    padding: 14px 18px;
    font-size: 15px;
    line-height: 1.5;
    color: #e8e3f0;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px;
    cursor: pointer;
    transition: all .18s;
    font-family: inherit;
  }
  button.choice:hover {
    background: rgba(167,139,250,0.13);
    border-color: rgba(167,139,250,0.5);
    transform: translateX(4px);
  }
  button.choice:active { transform: translateX(2px) scale(0.99); }

  .stats {
    display: flex;
    gap: 16px;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex-wrap: wrap;
  }
  .stat { flex: 1; min-width: 90px; }
  .stat .label {
    font-size: 11px;
    color: #7c7491;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }
  .stat .val {
    font-size: 15px;
    font-weight: 600;
    color: #e8e3f0;
  }
  .bar {
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    border-radius: 2px;
    transition: width .4s ease;
  }
  .bar.love > i { background: linear-gradient(90deg, #f472b6, #ec4899); }
  .bar.trust > i { background: linear-gradient(90deg, #38bdf8, #6366f1); }
  .bar.money > i { background: linear-gradient(90deg, #4ade80, #22c55e); }

  .ending-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #f472b6, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .ending-text {
    font-size: 15px;
    line-height: 1.9;
    color: #c4bdd6;
    margin-bottom: 24px;
    white-space: pre-wrap;
  }
  .ending-tag {
    display: inline-block;
    padding: 3px 10px;
    font-size: 11px;
    letter-spacing: 1px;
    border-radius: 999px;
    background: rgba(167,139,250,0.15);
    color: #a78bfa;
    margin-bottom: 14px;
  }

  .restart {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    color: #0f0d15;
    background: linear-gradient(135deg, #f472b6, #a78bfa);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s, box-shadow .15s;
  }
  .restart:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(167,139,250,0.35);
  }

  .fade { animation: fade .45s ease; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="game"></div>

<script>
(() => {
  const game = document.getElementById('game');

  // ---------- 状态 ----------
  let state = {
    love: 70,      // 感情
    trust: 50,     // 双方家庭信任
    money: 30,     // 存款（万元）
    node: 'start'
  };

  // ---------- 剧情节点 ----------
  const story = {

    start: {
      chapter: '第一章 · 六万',
      scene: `小豪和林小诚在一起三年。

她妈妈开口了：<span class="em">彩礼六万，一分不能少。</span>

小豪手里有三十万存款，是准备买房首付的。
六万，给得起。但这笔钱一旦出去，首付就不够了。

林小诚坐在小豪旁边，低着头，没说话。`,
      choices: [
        { text: '当晚和林小诚认真聊：这六万，我们俩一起想办法', effect: { love: +8, trust: +5 }, next: 'talk_together' },
        { text: '先答应下来，钱的事自己扛，不让她操心', effect: { love: +3, trust: -3 }, next: 'carry_alone' },
        { text: '觉得六万太多，想找她妈妈再谈谈', effect: { love: -3, trust: -5 }, next: 'bargain' }
      ]
    },

    talk_together: {
      chapter: '第二章 · 两个人',
      scene: `小豪把账本摊在桌上，和林小诚一笔一笔算。

她沉默很久，说：<span class="em">"我妈不是真要这六万，她是怕我嫁过去受委屈。"</span>

小豪忽然明白，这件事的核心不是钱，是<span class="warn">安全感</span>。`,
      choices: [
        { text: '一起去见林小诚妈妈，把买房的计划、还款的安排都说清楚', effect: { love: +10, trust: +15, money: -2 }, next: 'meet_mom_honest' },
        { text: '先凑六万给过去，把眼前这关过了再说', effect: { love: +5, trust: +5, money: -6 }, next: 'pay_first' },
        { text: '让林小诚自己去跟她妈妈沟通，小豪等结果', effect: { love: -8, trust: -5 }, next: 'push_to_girl' }
      ]
    },

    carry_alone: {
      chapter: '第二章 · 一个人扛',
      scene: `小豪没告诉林小诚，偷偷把六万转了过去。

她后来知道了，眼眶红了：<span class="em">"你为什么不跟我说？"</span>

小豪说不想让她为难。她说：<span class="warn">"可我们是要过一辈子的人。"</span>`,
      choices: [
        { text: '道歉，把后面的计划全部摊开和她商量', effect: { love: +7, trust: +8 }, next: 'meet_mom_honest' },
        { text: '坚持"男人就该扛"，继续一个人处理', effect: { love: -10, trust: -6 }, next: 'alone_end' },
        { text: '反过来怪她不理解自己的压力', effect: { love: -15, trust: -10 }, next: 'blame_end' }
      ]
    },

    bargain: {
      chapter: '第二章 · 讨价还价',
      scene: `小豪托林小诚带话，说六万能不能少点。

她妈妈当场变了脸：<span class="warn">"我女儿在你眼里就值这个价？"</span>

林小诚夹在中间，两头受气。`,
      choices: [
        { text: '意识到失礼，亲自上门道歉并把话说清楚', effect: { love: +6, trust: +10, money: -1 }, next: 'meet_mom_honest' },
        { text: '觉得对方不讲理，态度也硬起来', effect: { love: -12, trust: -15 }, next: 'fight_end' },
        { text: '让林小诚去说服她妈妈降低要求', effect: { love: -10, trust: -8 }, next: 'push_to_girl' }
      ]
    },

    meet_mom_honest: {
      chapter: '第三章 · 当面',
      scene: `小豪带着林小诚，拎着水果，坐在她家客厅。

小豪把买房的进度、每月的还款、彩礼的安排，一条一条讲给她妈妈听。

她妈妈没说话，喝了口茶：<span class="em">"你是个实在孩子。但我就一个女儿。"</span>`,
      choices: [
        { text: '坦诚说：六万我现在给，但房子会晚一年，希望您理解', effect: { love: +8, trust: +12, money: -6 }, next: 'honest_end' },
        { text: '承诺六万照给，房子也照买，咬牙两件事一起上', effect: { love: +5, trust: +8, money: -10 }, next: 'overload' },
        { text: '提出分期给彩礼，先给三万，剩下的一年内补齐', effect: { love: +3, trust: +5, money: -3 }, next: 'installment' }
      ]
    },

    pay_first: {
      chapter: '第三章 · 先过关',
      scene: `六万转过去了。她妈妈脸色缓和了些。

但买房的首付缺口，摆在了小豪和林小诚面前。

她问：<span class="em">"房子怎么办？"</span>`,
      choices: [
        { text: '坦白说清：先租房，两年内一定买', effect: { love: +6, trust: +6 }, next: 'rent_end' },
        { text: '借钱凑首付，先把房子拿下', effect: { love: +2, trust: +3, money: -8 }, next: 'debt_end' },
        { text: '回避这个问题，说"以后再说"', effect: { love: -8, trust: -6 }, next: 'avoid_end' }
      ]
    },

    push_to_girl: {
      chapter: '第三章 · 她一个人',
      scene: `林小诚一个人回了娘家。

她妈妈说了很多难听的话，她一句都没还嘴。

回来的时候，她眼睛是肿的。她只说了一句：<span class="warn">"我好累。"</span>`,
      choices: [
        { text: '抱住她，说"是我不好，这些本该我们一起面对"', effect: { love: +10, trust: +5 }, next: 'meet_mom_honest' },
        { text: '问她"你妈到底怎么说"', effect: { love: -8, trust: -3 }, next: 'cold_end' },
        { text: '沉默，不知道该说什么', effect: { love: -6, trust: -3 }, next: 'cold_end' }
      ]
    },

    overload: {
      chapter: '第四章 · 绷紧的弦',
      scene: `彩礼给了，房子也定了，首付借了一部分。

每个月还款压得小豪喘不过气。林小诚开始加班，两人见面的时间越来越少。

有一天她说：<span class="em">"我们已经很久没有好好说过话了。"</span>`,
      choices: [
        { text: '停下来，把还款计划重新排一遍，留出生活空间', effect: { love: +8, trust: +5, money: +2 }, next: 'balance_end' },
        { text: '继续硬撑，觉得熬过这段就好了', effect: { love: -10, trust: -5 }, next: 'burnout_end' },
        { text: '把压力发泄在林小诚身上', effect: { love: -18, trust: -10 }, next: 'blame_end' }
      ]
    },

    installment: {
      chapter: '第四章 · 分期',
      scene: `她妈妈勉强同意了分期。

先给三万，剩下的一年内补齐。小豪松了口气，但心里知道，这件事没真正过去。

林小诚问：<span class="em">"剩下那三万，你有把握吗？"</span>`,
      choices: [
        { text: '老实说：没十足把握，但我会想办法，也会告诉你进度', effect: { love: +9, trust: +8 }, next: 'honest_end' },
        { text: '拍胸脯说"放心，肯定没问题"', effect: { love: +2, trust: -2 }, next: 'overpromise_end' },
        { text: '反问她"你是不是也不信我"', effect: { love: -10, trust: -5 }, next: 'cold_end' }
      ]
    },

    // ---------- 结局 ----------
    honest_end: {
      ending: true,
      tag: '结局 · 一起面对',
      title: '六万，不是终点',
      text: `彩礼给了，房子晚了一年，但小豪和林小诚一起把每一笔账都算清楚了。

她妈妈后来跟邻居说："那孩子实在，我放心。"

三年后他们搬进新房那天，林小诚说：
"幸好当时我们没把彼此当成对手。"

真正拆散一对人的，从来不是六万块钱，
而是遇到六万块钱时，两个人站到了对立面。`
    },

    rent_end: {
      ending: true,
      tag: '结局 · 现实但坦诚',
      title: '先租房，也可以',
      text: `他们租了个小两居，把买房的计划写在了冰箱贴上。

她妈妈嘴上还有意见，但看到他们每个月都在往目标走，慢慢也就不说了。

日子不轻松，但他们知道自己在往哪去。

坦诚，比承诺更让人安心。`
    },

    debt_end: {
      ending: true,
      tag: '结局 · 负重前行',
      title: '房子有了，弦也紧了',
      text: `房子买下了，但每个月的还款像一根绷紧的弦。

他们很少吵架，但也很少说话。

有一天林小诚说："我们是不是把日子过成了任务？"

小豪愣住了。他意识到，房子是家的一部分，
但不是家的全部。`
    },

    avoid_end: {
      ending: true,
      tag: '结局 · 回避',
      title: '问题不会自己消失',
      text: `"以后再说"说了很多次，房子的事一直悬着。

她妈妈的意见越来越大，林小诚的沉默越来越长。

终于有一天，她说："我不是等不起房子，我是等不起一个不肯跟我一起想办法的人。"

有些问题，回避一次没事，回避一百次就成了结局。`
    },

    cold_end: {
      ending: true,
      tag: '结局 · 沉默',
      title: '累，是攒出来的',
      text: `她没有大吵大闹，只是越来越沉默。

小豪想解释，但每次开口都变成了辩解。

后来她提出分开。小豪说："就因为六万块钱？"

她摇头："不是因为六万，是因为这六万里，我一直是一个人。"`
    },

    fight_end: {
      ending: true,
      tag: '结局 · 对立',
      title: '赢了道理，输了人',
      text: `小豪和她的家人彻底闹僵了。

林小诚夹在中间，最后选择站在了她妈妈那边。

小豪不服气，觉得自己没错。

很多年后他才明白：在那场争执里，他争的是对错，
她想要的是他和她站在一起。`
    },

    blame_end: {
      ending: true,
      tag: '结局 · 迁怒',
      title: '压力不该由她承担',
      text: `小豪把所有的不顺都怪到了林小诚头上。

她一开始忍着，后来开始反驳，再后来就不说话了。

分开那天她说："我不怕穷，我怕你把穷怪到我身上。"

小豪这才发现，他弄丢的不是一段感情，
是一个本来愿意和他一起扛的人。`
    },

    burnout_end: {
      ending: true,
      tag: '结局 · 耗尽',
      title: '熬过去，但没熬回来',
      text: `小豪确实熬过了最难的那两年。

但林小诚在某个普通的晚上说："我们分开吧。"

小豪说："最难的时候都过来了，现在不是好了吗？"

她说："是好了，可我已经不想再等了。"

有些感情不是被大事击垮的，是被一件件小事磨没的。`
    },

    overpromise_end: {
      ending: true,
      tag: '结局 · 承诺',
      title: '承诺说出口容易，兑现难',
      text: `小豪拍着胸脯保证，但剩下的三万一直没凑齐。

她妈妈旧事重提，林小诚替他挡了几次话，后来说不动了。

小豪说："再给我一点时间。"

她说："我不是不信你，我是不知道还要等多久。"

承诺不是用来安抚当下的，是用来兑现未来的。`
    },

    balance_end: {
      ending: true,
      tag: '结局 · 平衡',
      title: '日子是过出来的',
      text: `他们重新排了还款计划，砍掉了一些不必要的开销，
也留出了每周一次"什么都不谈"的晚上。

房子晚了一年，但他们的关系没有晚。

她妈妈说："你们俩，像过日子的样子。"

六万块钱是个坎，但他们是跨过去，不是绕过去。`
    },

    alone_end: {
      ending: true,
      tag: '结局 · 独自承担',
      title: '一个人扛，两个人远',
      text: `小豪把所有事都自己处理了。

林小诚一开始感激，后来觉得被排除在外，再后来就不再问了。

小豪说："我这不是都为了你吗？"

她说："可我要的不是被安排，是被需要。"

爱不是替对方挡掉所有风雨，
而是让她知道，风雨里有她一个位置。`
    }
  };

  // ---------- 渲染 ----------
  function render() {
    const node = story[state.node];

    if (node.ending) {
      game.innerHTML = `
        <div class="fade">
          <div class="ending-tag">${node.tag}</div>
          <div class="ending-title">${node.title}</div>
          <div class="ending-text">${node.text}</div>
          <div class="stats">
            ${statBar('感情', state.love, 'love')}
            ${statBar('信任', state.trust, 'trust')}
            ${statBar('存款', state.money * 2, 'money', state.money + ' 万')}
          </div>
          <button class="restart" onclick="location.reload()">重新开始</button>
        </div>
      `;
      return;
    }

    game.innerHTML = `
      <div class="fade">
        <div class="chapter">${node.chapter}</div>
        <div class="stats">
          ${statBar('感情', state.love, 'love')}
          ${statBar('信任', state.trust, 'trust')}
          ${statBar('存款', state.money * 2, 'money', state.money + ' 万')}
        </div>
        <div class="scene">${node.scene}</div>
        <div class="choices">
          ${node.choices.map((c, i) =>
            `<button class="choice" data-idx="${i}">${c.text}</button>`
          ).join('')}
        </div>
      </div>
    `;

    game.querySelectorAll('.choice').forEach(btn => {
      btn.addEventListener('click', () => {
        const choice = node.choices[+btn.dataset.idx];
        applyEffect(choice.effect);
        state.node = choice.next;
        render();
      });
    });
  }

  function statBar(label, value, cls, display) {
    const v = Math.max(0, Math.min(100, value));
    return `
      <div class="stat">
        <div class="label">${label}</div>
        <div class="val">${display !== undefined ? display : v}</div>
        <div class="bar ${cls}"><i style="width:${v}%"></i></div>
      </div>
    `;
  }

  function applyEffect(effect) {
    if (!effect) return;
    if (effect.love)  state.love  = Math.max(0, Math.min(100, state.love + effect.love));
    if (effect.trust) state.trust = Math.max(0, Math.min(100, state.trust + effect.trust));
    if (effect.money) state.money = Math.max(0, state.money + effect.money);
  }

  render();
})();
</script>
</body>
</html>
